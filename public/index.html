<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ WMS QC MONITOR - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- <script src="https://cdn.tailwindcss.com/3.4.17"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> -->
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <style>
      /* Font chữ có thể giữ ở đây */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <div id="nav-container"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Filter bar sẽ được component FilterBar render vào container này -->
      <div
        id="filter-bar-container"
        class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6"
      >
        <!-- Nội dung tĩnh cho LCP -->
        <div
          class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
        >
          <div>
            <h1
              class="text-2xl font-bold text-slate-900 flex items-center gap-2"
            >
              <i data-lucide="trending-up" class="text-emerald-500"></i>
              Theo Dõi Năng Suất Thời Gian Thực
            </h1>
            <p class="text-slate-500 text-sm mt-1">
              Phân tích chi tiết lượng đơn quét của từng QC theo từng khung giờ
              trong ngày.
            </p>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <div
              class="flex items-center bg-slate-100 border border-slate-200 rounded-xl px-3 h-11"
            >
              <i data-lucide="calendar" class="w-4 h-4 text-slate-400 mr-2"></i>
              <input
                type="date"
                id="filter-date"
                class="bg-transparent border-0 text-slate-700 text-sm font-semibold focus:ring-0 focus:outline-none"
              />
            </div>

            <!-- MULTI-SELECT ROLE -->
            <div class="relative" id="role-multi-select">
              <button
                type="button"
                id="role-btn"
                class="flex items-center bg-white border border-slate-200 rounded-xl px-3 h-11 text-sm focus:outline-none min-w-[180px] hover:bg-slate-50 transition-colors"
              >
                <i
                  data-lucide="user-cog"
                  class="w-4 h-4 text-slate-400 mr-2"
                ></i>
                <span
                  id="role-btn-text"
                  class="flex-1 text-left text-slate-700 truncate"
                  >Tất cả role</span
                >
                <i
                  data-lucide="chevron-down"
                  id="role-arrow"
                  class="w-4 h-4 text-slate-400 ml-2 transition-transform duration-200"
                ></i>
              </button>
              <div
                id="role-dropdown"
                class="absolute left-0 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg z-30 max-h-72 overflow-hidden transition-all duration-200 ease-in-out"
                style="max-height: 0; opacity: 0; visibility: hidden"
              >
                <div class="p-2 border-b border-slate-100 flex justify-between">
                  <button
                    type="button"
                    id="select-all-roles"
                    class="text-xs font-medium text-emerald-600 hover:text-emerald-700 transition-colors"
                  >
                    Chọn tất cả
                  </button>
                  <button
                    type="button"
                    id="deselect-all-roles"
                    class="text-xs font-medium text-slate-500 hover:text-slate-700 transition-colors"
                  >
                    Bỏ chọn
                  </button>
                </div>
                <div
                  id="role-checkboxes"
                  class="p-2 space-y-1 overflow-y-auto max-h-48"
                ></div>
              </div>
            </div>

            <div
              class="flex items-center bg-white border border-slate-200 rounded-xl px-3 h-11"
            >
              <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2"></i>
              <input
                id="filter-q"
                placeholder="Tìm theo tên hoặc email"
                class="text-sm focus:outline-none w-44"
              />
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-xl px-3 h-11"
            >
              <label class="text-sm text-slate-500 mr-2 whitespace-nowrap"
                >Min Tổng</label
              >
              <input
                id="filter-min-total"
                type="number"
                min="0"
                placeholder="0"
                class="w-20 text-sm focus:outline-none"
              />
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-xl px-3 h-11"
            >
              <label class="text-sm text-slate-500 mr-2 whitespace-nowrap"
                >Giờ</label
              >
              <input
                id="filter-hour-start"
                type="number"
                min="0"
                max="23"
                class="w-14 text-sm focus:outline-none mr-2"
              />
              <span class="text-sm text-slate-400">→</span>
              <input
                id="filter-hour-end"
                type="number"
                min="0"
                max="23"
                class="w-14 text-sm focus:outline-none ml-2"
              />
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-xl px-3 h-11"
            >
              <label
                class="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer whitespace-nowrap"
              >
                <input id="filter-active-only" type="checkbox" />
                <span>Chỉ hiển thị đang active</span>
              </label>
            </div>
            <div class="flex items-center gap-3 ml-auto">
              <button
                id="export-btn"
                class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-5 h-11 rounded-xl transition shadow-sm"
              >
                <i data-lucide="download" class="w-4 h-4"></i> Xuất Excel
              </button>
              <button
                id="reset-btn"
                class="flex items-center gap-2 bg-rose-500 hover:bg-rose-600 text-white font-semibold text-sm px-4 h-11 rounded-xl transition shadow-sm"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i> Đặt lại
              </button>
              <button
                id="refresh-btn"
                class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm px-5 h-11 rounded-xl transition shadow-sm"
              >
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Làm Mới
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats overview -->
      <div
        id="stats-overview"
        class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"
      >
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >Tổng Đơn Quét</span
            >
            <h3
              id="stat-total-orders"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0
            </h3>
          </div>
          <div class="bg-emerald-50 text-emerald-600 p-4 rounded-xl">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >QC Đang Hoạt Động</span
            >
            <h3
              id="stat-active-qcs"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0
            </h3>
          </div>
          <div class="bg-indigo-50 text-indigo-600 p-4 rounded-xl">
            <i data-lucide="user-check" class="w-6 h-6"></i>
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >Hiệu Suất Trung Bình</span
            >
            <h3
              id="stat-avg-performance"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0 <span class="text-xs text-slate-400 font-normal">đơn/giờ</span>
            </h3>
          </div>
          <div class="bg-amber-50 text-amber-600 p-4 rounded-xl">
            <i data-lucide="gauge" class="w-6 h-6"></i>
          </div>
        </div>
      </div>

      <!-- Bảng heatmap -->
      <div
        id="heatmap-table"
        class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"
      ></div>
    </main>

    <footer
      class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-sm text-slate-500"
    >
      <div class="container mx-auto px-4">© 2026 QC Productivity Tracker.</div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
