<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ WMS QC MONITOR - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- <script src="https://cdn.tailwindcss.com/3.4.17"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> -->
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <style>
      /* Font chữ có thể giữ ở đây */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <div id="nav-container"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Filter bar sẽ được component FilterBar render vào container này -->
      <div
        id="filter-bar-container"
        class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6"
      >
        <!-- Nội dung tĩnh cho LCP -->
        <div
          class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
        >
          <div>
            <h1
              class="text-2xl font-bold text-slate-900 flex items-center gap-2"
            >
              <i data-lucide="trending-up" class="text-emerald-500"></i>
              Theo Dõi Năng Suất Thời Gian Thực
            </h1>
            <p class="text-slate-500 text-sm mt-1">
              Phân tích chi tiết lượng đơn quét của từng QC theo từng khung giờ
              trong ngày.
            </p>
          </div>
          <!-- Các control lọc có thể để trống, sẽ được thay thế bởi FilterBar -->
        </div>
      </div>

      <!-- Stats overview -->
      <div
        id="stats-overview"
        class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"
      >
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >Tổng Đơn Quét</span
            >
            <h3
              id="stat-total-orders"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0
            </h3>
          </div>
          <div class="bg-emerald-50 text-emerald-600 p-4 rounded-xl">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >QC Đang Hoạt Động</span
            >
            <h3
              id="stat-active-qcs"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0
            </h3>
          </div>
          <div class="bg-indigo-50 text-indigo-600 p-4 rounded-xl">
            <i data-lucide="user-check" class="w-6 h-6"></i>
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >Hiệu Suất Trung Bình</span
            >
            <h3
              id="stat-avg-performance"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0 <span class="text-xs text-slate-400 font-normal">đơn/giờ</span>
            </h3>
          </div>
          <div class="bg-amber-50 text-amber-600 p-4 rounded-xl">
            <i data-lucide="gauge" class="w-6 h-6"></i>
          </div>
        </div>
      </div>

      <!-- Bảng heatmap -->
      <div
        id="heatmap-table"
        class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"
      ></div>
    </main>

    <footer
      class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-sm text-slate-500"
    >
      <div class="container mx-auto px-4">© 2026 QC Productivity Tracker.</div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
