<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ WMS QC MONITOR - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="css/dashboard.css" />
    <style>
      /* Font chữ có thể giữ ở đây */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <nav
      class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-3">
            <div
              class="bg-amber-500 text-slate-950 p-2 rounded-lg flex items-center justify-center shadow-inner"
            >
              <i data-lucide="zap" class="w-5 h-5"></i>
            </div>
            <span class="text-white font-bold text-lg tracking-wider"
              >WMS QC MONITOR</span
            >
          </div>
          <div class="flex space-x-1">
            <a
              href="/"
              class="flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-amber-400 border border-slate-700"
            >
              <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
              <span>Dashboard</span>
            </a>
            <a
              href="/users.html"
              class="flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
            >
              <i data-lucide="users" class="w-4 h-4"></i>
              <span>Nhân Sự</span>
            </a>
            <a
              href="/targets.html"
              class="flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
            >
              <i data-lucide="target" class="w-4 h-4"></i>
              <span>Roles &amp; Targets</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Filter bar sẽ được component FilterBar render vào container này -->
      <div
        id="filter-bar-container"
        class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6"
      ></div>

      <!-- Stats overview -->
      <div
        id="stats-overview"
        class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"
      >
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >Tổng Đơn Quét</span
            >
            <h3
              id="stat-total-orders"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0
            </h3>
          </div>
          <div class="bg-emerald-50 text-emerald-600 p-4 rounded-xl">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >QC Đang Hoạt Động</span
            >
            <h3
              id="stat-active-qcs"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0
            </h3>
          </div>
          <div class="bg-indigo-50 text-indigo-600 p-4 rounded-xl">
            <i data-lucide="user-check" class="w-6 h-6"></i>
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"
        >
          <div>
            <span
              class="text-slate-400 text-xs font-semibold uppercase tracking-wider"
              >Hiệu Suất Trung Bình</span
            >
            <h3
              id="stat-avg-performance"
              class="text-3xl font-bold text-slate-900 mt-1"
            >
              0 <span class="text-xs text-slate-400 font-normal">đơn/giờ</span>
            </h3>
          </div>
          <div class="bg-amber-50 text-amber-600 p-4 rounded-xl">
            <i data-lucide="gauge" class="w-6 h-6"></i>
          </div>
        </div>
      </div>

      <!-- Bảng heatmap -->
      <div
        id="heatmap-table"
        class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"
      ></div>
    </main>

    <footer
      class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-sm text-slate-500"
    >
      <div class="container mx-auto px-4">© 2026 QC Productivity Tracker.</div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
