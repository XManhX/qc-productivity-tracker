<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .loader {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e8f0;
        border-top: 3px solid #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #seatalk_login_button {
        display: inline-flex;
        justify-content: center;
      }
      #seatalk_login_button,
      #seatalk_login_button * {
        font-family: "Inter", sans-serif;
      }
      .fade-in {
        animation: fadeIn 0.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4"
  >
    <div class="w-full max-w-md">
      <!-- Logo / Tên hệ thống -->
      <div class="text-center mb-8 fade-in">
        <div
          class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 mb-4"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8 text-amber-400"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">
          WMS QC Monitor
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Hệ thống giám sát năng suất QC
        </p>
      </div>

      <!-- Card đăng nhập -->
      <div
        class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-8 shadow-2xl fade-in"
      >
        <div id="login-container" class="flex flex-col items-center">
          <!-- Loading -->
          <div id="loading-indicator" class="flex flex-col items-center gap-3">
            <div class="loader"></div>
            <p class="text-slate-400 text-sm">Đang kiểm tra trạng thái...</p>
          </div>

          <!-- Thông tin App (ẩn) -->
          <div id="seatalk_login_app_info" style="display: none"></div>

          <!-- Nút đăng nhập SeaTalk (ẩn cho đến khi sẵn sàng) -->
          <div
            id="seatalk_login_button_wrapper"
            style="display: none"
            class="w-full flex justify-center"
          >
            <div id="seatalk_login_button"></div>
          </div>
        </div>

        <!-- Thông báo lỗi -->
        <div
          id="error-message"
          class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-300 text-sm text-center"
        ></div>
      </div>

      <!-- Footer -->
      <p class="text-center text-slate-500 text-xs mt-6 fade-in">
        &copy; 2025 WMS. Đăng nhập bằng tài khoản SeaTalk của bạn.
      </p>
    </div>

    <!-- SeaTalk SDK -->
    <script src="https://static.cdn.haiserve.com/seatalk/client/shared/sop/auth.js"></script>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const errorEl = $("error-message");
        const loadingEl = $("loading-indicator");
        const wrapperEl = $("seatalk_login_button_wrapper");
        const appInfoEl = $("seatalk_login_app_info");
        const buttonEl = $("seatalk_login_button");

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.classList.remove("hidden");
        }

        function hideError() {
          errorEl.classList.add("hidden");
        }

        function showLoading(visible) {
          loadingEl.style.display = visible ? "flex" : "none";
          wrapperEl.style.display = visible ? "none" : "flex";
        }

        // 1. Kiểm tra token hiện có
        async function checkExistingToken() {
          const token = localStorage.getItem("qc_session_token");
          if (!token) return false;

          try {
            const resp = await fetch("/api/qc/me", {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (resp.ok) {
              window.location.href = "/index.html";
              return true;
            }
            // Token không hợp lệ -> xoá
            localStorage.removeItem("qc_session_token");
          } catch {
            localStorage.removeItem("qc_session_token");
          }
          return false;
        }

        // 2. Đọc lỗi từ URL
        function handleUrlError() {
          const params = new URLSearchParams(window.location.search);
          const error = params.get("error");
          if (!error) return false;

          const messages = {
            missing_code: "Thiếu mã xác thực từ SeaTalk.",
            token_exchange_failed:
              "Xác thực không thành công. Vui lòng thử lại.",
            profile_fetch_failed: "Không thể lấy thông tin người dùng.",
            unauthorized:
              "Tài khoản của bạn không được phép truy cập hệ thống này.",
            internal_error: "Lỗi hệ thống. Vui lòng thử lại sau.",
            state_mismatch: "Yêu cầu không hợp lệ (state không khớp).",
            token_failed: "Không thể lấy App Access Token.",
            sso_failed: "Xác minh SSO thất bại.",
          };
          showError(messages[error] || "Đã xảy ra lỗi không xác định.");
          return true;
        }

        // 3. Khởi tạo nút SeaTalk
        async function initLoginButton() {
          try {
            const res = await fetch("/api/config/public");
            if (!res.ok) throw new Error("Không thể tải cấu hình hệ thống.");
            const config = await res.json();

            const { seatalkAppId, seatalkRedirectUri } = config;
            if (!seatalkAppId || !seatalkRedirectUri) {
              throw new Error("Cấu hình SeaTalk chưa đầy đủ.");
            }

            const state = crypto.randomUUID
              ? crypto.randomUUID()
              : Math.random().toString(36).substring(2, 15);
            sessionStorage.setItem("seatalk_oauth_state", state);

            appInfoEl.setAttribute("data-appid", seatalkAppId);
            appInfoEl.setAttribute("data-redirect_uri", seatalkRedirectUri);
            appInfoEl.setAttribute("data-response_type", "code");
            appInfoEl.setAttribute("data-state", state);

            buttonEl.setAttribute("data-size", "medium");
            buttonEl.setAttribute("data-align", "center");
            buttonEl.setAttribute("data-theme", "light");
            buttonEl.setAttribute("data-logo_size", "24");
            buttonEl.setAttribute("data-copywriting", "Đăng nhập với SeaTalk");

            showLoading(false);

            // Đảm bảo SDK render (nếu cần)
            if (typeof SOPAuth !== "undefined" && SOPAuth.render) {
              SOPAuth.render();
            }
          } catch (err) {
            console.error(err);
            showError("Không thể khởi tạo đăng nhập. Vui lòng thử lại sau.");
            showLoading(false);
          }
        }

        // 4. Main
        (async function main() {
          hideError();
          showLoading(true);

          const hasValidToken = await checkExistingToken();
          if (hasValidToken) return; // đã redirect

          const hasError = handleUrlError();
          if (hasError) {
            showLoading(false);
            return;
          }

          await initLoginButton();
        })();
      })();
    </script>
  </body>
</html>
