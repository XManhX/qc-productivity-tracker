<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-black"
  >
    <!-- Nền động: các đốm sáng di chuyển chậm -->
    <div class="absolute inset-0">
      <div
        class="absolute top-1/4 left-1/4 w-96 h-96 bg-amber-500/20 rounded-full blur-[120px] animate-float-slow"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full blur-[120px] animate-float-slower"
      ></div>
    </div>

    <div class="relative w-full max-w-md z-10">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 mb-4 shadow-lg shadow-amber-500/30"
        >
          <i data-lucide="zap" class="w-7 h-7"></i>
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight">
          WMS QC Monitor
        </h1>
        <p class="text-slate-400 text-sm mt-1">Hệ thống giám sát năng suất</p>
      </div>

      <!-- Card đăng nhập -->
      <div
        class="login-card bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl p-8"
      >
        <h2 class="text-xl font-semibold text-white text-center mb-6">
          Chào mừng trở lại
        </h2>

        <form id="login-form" class="space-y-5">
          <!-- Email -->
          <div class="relative group">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-amber-400 transition-colors"
            >
              <i data-lucide="mail" class="w-5 h-5"></i>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl pl-12 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/70 focus:border-transparent transition-all duration-300"
              placeholder="Email"
              required
            />
          </div>

          <!-- Mật khẩu -->
          <div class="relative group">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-amber-400 transition-colors"
            >
              <i data-lucide="lock" class="w-5 h-5"></i>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl pl-12 pr-14 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/70 focus:border-transparent transition-all duration-300"
              placeholder="Mật khẩu"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50"
              title="Hiển thị mật khẩu"
            >
              <i data-lucide="eye-off" class="w-5 h-5 pointer-events-none"></i>
            </button>
          </div>

          <!-- Ghi nhớ email + Quên mật khẩu -->
          <div class="flex items-center justify-between">
            <label
              class="flex items-center text-sm text-slate-300 cursor-pointer select-none"
            >
              <div class="relative mr-3">
                <input
                  type="checkbox"
                  id="remember-email"
                  class="peer sr-only"
                />
                <div
                  class="w-5 h-5 border-2 border-slate-500 rounded-md bg-slate-800/50 peer-checked:bg-amber-500 peer-checked:border-amber-500 transition-all duration-200 flex items-center justify-center"
                >
                  <i
                    data-lucide="check"
                    class="w-4 h-4 text-slate-950 opacity-0 peer-checked:opacity-100 transition-opacity duration-200 absolute"
                  ></i>
                </div>
              </div>
              <span>Ghi nhớ email</span>
            </label>
            <a
              href="#"
              class="text-sm text-amber-400 hover:text-amber-300 transition-colors font-medium"
              >Quên mật khẩu?</a
            >
          </div>

          <!-- Nút đăng nhập -->
          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-semibold py-3.5 rounded-xl transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center space-x-2 shadow-lg shadow-amber-500/25 hover:shadow-amber-500/40 active:scale-[0.98]"
          >
            <span id="btn-text">Đăng nhập</span>
            <span id="btn-spinner" class="hidden">
              <svg
                class="animate-spin h-5 w-5 text-slate-950"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                ></path>
              </svg>
            </span>
          </button>

          <!-- Thông báo lỗi -->
          <div
            id="error-message"
            class="hidden bg-red-400/10 border border-red-400/30 rounded-xl py-2.5 px-4 text-red-400 text-sm text-center"
          ></div>
        </form>
      </div>

      <p class="text-center text-slate-500 text-xs mt-6">
        &copy; 2025 WMS. Nội bộ
      </p>
    </div>

    <script type="module" src="js/main-login.js"></script>
    <script>
      window.addEventListener("load", () => {
        if (typeof lucide !== "undefined") lucide.createIcons();
      });
    </script>
  </body>
</html>
