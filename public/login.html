<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body
    class="bg-slate-950 min-h-screen flex items-center justify-center p-4 font-inter"
    style="font-family: &quot;Inter&quot;, sans-serif"
  >
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-amber-500 text-slate-950 mb-3"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">WMS QC Monitor</h1>
        <p class="text-slate-400 text-sm">Hệ thống giám sát năng suất QC</p>
      </div>

      <!-- Card đăng nhập -->
      <div
        class="login-card bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-6"
      >
        <form id="login-form" class="space-y-5">
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-slate-300 mb-1"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="relative">
            <label
              for="password"
              class="block text-sm font-medium text-slate-300 mb-1"
              >Mật khẩu</label
            >
            <input
              type="password"
              id="password"
              name="password"
              class="form-input pr-10"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-2 top-8 text-slate-400 hover:text-white"
            >
              <!-- Icon mắt (có thể dùng Lucide hoặc SVG đơn giản) -->
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center text-sm text-slate-400">
              <input
                type="checkbox"
                id="remember-email"
                class="mr-2 rounded bg-slate-700 border-slate-600 text-amber-500 focus:ring-amber-500"
              />
              Ghi nhớ email
            </label>
            <a href="#" class="text-sm text-amber-400 hover:text-amber-300"
              >Quên mật khẩu?</a
            >
          </div>
          <button
            type="submit"
            id="submit-btn"
            class="btn-primary w-full flex items-center justify-center"
          >
            <span id="btn-text">Đăng nhập</span>
            <span id="btn-spinner" class="hidden ml-2">
              <svg
                class="animate-spin h-4 w-4 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                ></path>
              </svg>
            </span>
          </button>
          <p
            id="error-message"
            class="text-red-400 text-sm hidden text-center"
          ></p>
        </form>
      </div>

      <p class="text-center text-slate-500 text-xs mt-6">
        &copy; 2026 NXM. Chỉ dành cho nhân viên được ủy quyền.
      </p>
    </div>

    <script type="module" src="js/main-login.js"></script>
  </body>
</html>
