<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Tailwind CDN vẫn giữ để dùng các class tiện ích (hidden, flex...) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="logo-container">
        <div class="logo-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <h1 class="logo-title">WMS QC Monitor</h1>
        <p class="logo-subtitle">Hệ thống giám sát năng suất QC</p>
      </div>

      <!-- Card đăng nhập -->
      <div class="login-card">
        <!-- Tabs -->
        <div class="tabs">
          <button id="tab-seatalk" class="tab-button active">SeaTalk</button>
          <button id="tab-email" class="tab-button">Email</button>
        </div>

        <!-- SeaTalk Login -->
        <div id="seatalk-content">
          <div class="flex flex-col items-center">
            <div
              id="loading-indicator"
              class="flex flex-col items-center gap-3"
            >
              <div class="loader"></div>
              <p class="text-slate-400 text-sm">Đang kiểm tra trạng thái...</p>
            </div>
            <div id="seatalk_login_app_info" class="hidden"></div>
            <div
              id="seatalk_login_button_wrapper"
              class="seatalk-button-wrapper hidden"
            >
              <div id="seatalk_login_button"></div>
            </div>
          </div>
        </div>

        <!-- Email Login -->
        <div id="email-content" class="hidden">
          <form id="email-login-form" class="login-form">
            <div class="form-group">
              <label for="login-email" class="form-label">Email</label>
              <input
                type="email"
                id="login-email"
                class="form-input"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="login-password" class="form-label">Mật khẩu</label>
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="••••••••"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
            <p id="email-login-error" class="error-message hidden"></p>
          </form>
        </div>

        <!-- Lỗi chung -->
        <div id="error-message" class="error-message hidden"></div>
      </div>

      <p class="footer-text">
        &copy; 2025 WMS. Đăng nhập bằng SeaTalk hoặc email.
      </p>
    </div>

    <!-- SeaTalk SDK -->
    <script src="https://static.cdn.haiserve.com/seatalk/client/shared/sop/auth.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const errorEl = $("error-message");
        const loadingEl = $("loading-indicator");
        const wrapperEl = $("seatalk_login_button_wrapper");
        const appInfoEl = $("seatalk_login_app_info");
        const buttonEl = $("seatalk_login_button");
        const emailForm = $("email-login-form");
        const emailError = $("email-login-error");

        // Tab switching
        let activeTab = "seatalk";
        function setTab(tab) {
          activeTab = tab;
          $("tab-seatalk").classList.toggle("active", tab === "seatalk");
          $("tab-email").classList.toggle("active", tab === "email");
          $("seatalk-content").classList.toggle("hidden", tab !== "seatalk");
          $("email-content").classList.toggle("hidden", tab !== "email");
        }
        $("tab-seatalk").addEventListener("click", () => setTab("seatalk"));
        $("tab-email").addEventListener("click", () => setTab("email"));

        // Kiểm tra token cũ
        async function checkExistingToken() {
          const token = localStorage.getItem("qc_session_token");
          if (!token) return false;
          try {
            const resp = await fetch("/api/qc/me", {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (resp.ok) {
              window.location.href = "/index.html";
              return true;
            }
          } catch {}
          localStorage.removeItem("qc_session_token");
          return false;
        }

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.classList.remove("hidden");
        }

        function handleUrlError() {
          const params = new URLSearchParams(window.location.search);
          const error = params.get("error");
          if (!error) return false;
          const messages = {
            missing_code: "Thiếu mã xác thực từ SeaTalk.",
            token_exchange_failed: "Xác thực không thành công.",
            sso_failed: "Xác minh SSO thất bại.",
            unauthorized: "Tài khoản không được phép.",
            internal_error: "Lỗi hệ thống.",
          };
          showError(messages[error] || "Đã xảy ra lỗi.");
          return true;
        }

        // Khởi tạo nút SeaTalk
        async function initSeaTalk() {
          try {
            const res = await fetch("/api/config/public");
            const config = await res.json();
            const { seatalkAppId, seatalkRedirectUri } = config;
            if (!seatalkAppId || !seatalkRedirectUri)
              throw new Error("Thiếu cấu hình");

            const state = crypto.randomUUID();
            sessionStorage.setItem("seatalk_oauth_state", state);
            appInfoEl.setAttribute("data-appid", seatalkAppId);
            appInfoEl.setAttribute("data-redirect_uri", seatalkRedirectUri);
            appInfoEl.setAttribute("data-response_type", "code");
            appInfoEl.setAttribute("data-state", state);
            buttonEl.setAttribute("data-size", "medium");
            buttonEl.setAttribute("data-theme", "light");
            buttonEl.setAttribute("data-copywriting", "Đăng nhập với SeaTalk");
            loadingEl.style.display = "none";
            wrapperEl.classList.remove("hidden");
            if (typeof SOPAuth !== "undefined" && SOPAuth.render)
              SOPAuth.render();
          } catch (e) {
            showError("Không thể tải cấu hình SeaTalk");
          }
        }

        // Đăng nhập bằng email
        emailForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = $("login-email").value.trim();
          const password = $("login-password").value;
          emailError.classList.add("hidden");
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (res.ok && data.success) {
              // Lưu token và đợi hoàn tất
              localStorage.setItem("qc_session_token", data.token);
              // Kiểm tra nếu token đã được lưu
              console.log(
                "Token saved:",
                localStorage.getItem("qc_session_token"),
              );
              // Chuyển hướng sau khi chắc chắn đã lưu
              window.location.href = "/index.html";
            } else {
              emailError.textContent = data.error || "Đăng nhập thất bại";
              emailError.classList.remove("hidden");
            }
          } catch (err) {
            emailError.textContent = "Lỗi kết nối";
            emailError.classList.remove("hidden");
          }
        });

        // Main
        (async function main() {
          if (await checkExistingToken()) return;
          if (handleUrlError()) return;
          await initSeaTalk();
        })();
      })();
    </script>
  </body>
</html>
