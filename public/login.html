<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/login.css?v=4" />
    <style>
      /* Màu cam shopee tùy chỉnh */
      :root {
        --shopee: #ee4d2d;
        --shopee-light: #ff6b4a;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-black"
  >
    <canvas id="particle-canvas" class="absolute inset-0 z-0"></canvas>

    <div class="relative w-full max-w-md z-10">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-400 to-[var(--shopee)] text-white mb-4 shadow-lg shadow-orange-500/30"
        >
          <i data-lucide="zap" class="w-7 h-7"></i>
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight">
          WMS QC Monitor
        </h1>
        <p class="text-slate-400 text-sm mt-1">Trung tâm giám sát năng suất</p>
      </div>

      <!-- Card sci‑fi cam -->
      <div
        class="sci-fi-card relative bg-white/5 backdrop-blur-2xl border border-orange-500/30 rounded-3xl shadow-2xl p-8 overflow-hidden"
      >
        <div class="scan-line absolute inset-0 pointer-events-none"></div>
        <h2 class="text-xl font-semibold text-white text-center mb-6">
          Xác thực danh tính
        </h2>

        <form id="login-form" class="space-y-5">
          <!-- Email -->
          <div class="relative group">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[var(--shopee)] transition-colors"
            >
              <i data-lucide="mail" class="w-5 h-5"></i>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              class="sci-input w-full bg-slate-800/50 border border-slate-700/50 rounded-xl pl-12 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[var(--shopee)]/70 focus:border-transparent transition-all duration-300"
              placeholder="Email"
              required
            />
          </div>

          <!-- Mật khẩu -->
          <div class="relative group">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[var(--shopee)] transition-colors"
            >
              <i data-lucide="lock" class="w-5 h-5"></i>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              class="sci-input w-full bg-slate-800/50 border border-slate-700/50 rounded-xl pl-12 pr-14 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[var(--shopee)]/70 focus:border-transparent transition-all duration-300"
              placeholder="Mật khẩu"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-[var(--shopee)]/50"
              title="Hiển thị mật khẩu"
            >
              <svg
                id="eye-off-icon"
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
              <svg
                id="eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 hidden"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <!-- Ghi nhớ email + Quên mật khẩu -->
          <div class="flex items-center justify-between">
            <label
              class="flex items-center text-sm text-slate-300 cursor-pointer select-none"
            >
              <div class="relative mr-3">
                <input
                  type="checkbox"
                  id="remember-email"
                  class="peer sr-only"
                />
                <div
                  class="w-5 h-5 border-2 border-slate-500 rounded-md bg-slate-800/50 peer-checked:bg-[var(--shopee)] peer-checked:border-[var(--shopee)] transition-all duration-200 flex items-center justify-center"
                >
                  <i
                    data-lucide="check"
                    class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100 transition-opacity duration-200 absolute"
                  ></i>
                </div>
              </div>
              <span>Ghi nhớ email</span>
            </label>
            <a
              href="#"
              class="text-sm text-[var(--shopee)] hover:text-[var(--shopee-light)] transition-colors font-medium"
              >Quên mật khẩu?</a
            >
          </div>

          <!-- Nút đăng nhập -->
          <button
            type="submit"
            id="submit-btn"
            class="sci-btn w-full bg-gradient-to-r from-[var(--shopee)] to-[var(--shopee-light)] hover:from-[var(--shopee-light)] hover:to-[var(--shopee)] text-white font-semibold py-3.5 rounded-xl transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center space-x-2 shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 active:scale-[0.98]"
            style="background-size: 200% auto"
          >
            <span id="btn-text">Đăng nhập</span>
            <span id="btn-spinner" class="hidden">
              <svg
                class="animate-spin h-5 w-5 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                ></path>
              </svg>
            </span>
          </button>

          <div
            id="error-message"
            class="hidden bg-red-400/10 border border-red-400/30 rounded-xl py-2.5 px-4 text-red-400 text-sm text-center"
          ></div>
        </form>
      </div>

      <p class="text-center text-slate-500 text-xs mt-6">
        &copy; 2026 WMS. Hệ thống nội bộ
      </p>
    </div>

    <script src="js/utils/particles.js"></script>
    <script type="module" src="js/main-login.js"></script>
    <script>
      window.addEventListener("load", () => {
        if (typeof lucide !== "undefined") lucide.createIcons();
      });
    </script>
  </body>
</html>
