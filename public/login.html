<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide icons (đồng bộ dashboard) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/login.css" />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-amber-500 text-slate-950 mb-3"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">WMS QC Monitor</h1>
        <p class="text-slate-400 text-sm">Hệ thống giám sát năng suất QC</p>
      </div>

      <!-- Card đăng nhập -->
      <div
        class="login-card bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-6"
      >
        <form id="login-form" class="space-y-5">
          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-slate-300 mb-1"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
              placeholder="you@example.com"
              required
            />
          </div>

          <!-- Mật khẩu -->
          <div class="relative">
            <label
              for="password"
              class="block text-sm font-medium text-slate-300 mb-1"
              >Mật khẩu</label
            >
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 pr-10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-2 top-[38px] text-slate-400 hover:text-white focus:outline-none transition-colors"
              title="Hiển thị mật khẩu"
            >
              <i data-lucide="eye-off" class="w-5 h-5 pointer-events-none"></i>
            </button>
          </div>

          <!-- Ghi nhớ email & Quên mật khẩu -->
          <div class="flex items-center justify-between">
            <label
              class="flex items-center text-sm text-slate-400 cursor-pointer select-none"
            >
              <input
                type="checkbox"
                id="remember-email"
                class="w-4 h-4 rounded bg-slate-700 border-slate-600 text-amber-500 focus:ring-amber-500 focus:ring-offset-0 cursor-pointer"
              />
              <span class="ml-2">Ghi nhớ email</span>
            </label>
            <a
              href="#"
              class="text-sm text-amber-400 hover:text-amber-300 transition-colors"
              >Quên mật khẩu?</a
            >
          </div>

          <!-- Nút đăng nhập -->
          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2.5 px-4 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center space-x-2"
          >
            <span id="btn-text">Đăng nhập</span>
            <span id="btn-spinner" class="hidden">
              <svg
                class="animate-spin h-4 w-4 text-slate-950"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                ></path>
              </svg>
            </span>
          </button>

          <!-- Thông báo lỗi -->
          <p
            id="error-message"
            class="text-red-400 text-sm hidden text-center"
          ></p>
        </form>
      </div>

      <p class="text-center text-slate-500 text-xs mt-6">
        &copy; 2025 WMS. Chỉ dành cho nhân viên được ủy quyền.
      </p>
    </div>

    <script type="module" src="js/main-login.js"></script>
  </body>
</html>
