<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WMS QC Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .loader {
        width: 30px;
        height: 30px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #f59e0b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4"
  >
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 mb-4"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8 text-amber-400"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">
          WMS QC Monitor
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Hệ thống giám sát năng suất QC
        </p>
      </div>

      <!-- Card đăng nhập -->
      <div
        class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-8 shadow-2xl"
      >
        <!-- Tabs -->
        <div class="flex mb-6 border-b border-white/10">
          <button
            id="tab-seatalk"
            class="flex-1 pb-3 text-sm font-medium text-amber-400 border-b-2 border-amber-400"
          >
            SeaTalk
          </button>
          <button
            id="tab-email"
            class="flex-1 pb-3 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-white transition"
          >
            Email
          </button>
        </div>

        <!-- SeaTalk Login -->
        <div id="seatalk-content">
          <div class="flex flex-col items-center">
            <div
              id="loading-indicator"
              class="flex flex-col items-center gap-3"
            >
              <div class="loader"></div>
              <p class="text-slate-400 text-sm">Đang kiểm tra trạng thái...</p>
            </div>
            <div id="seatalk_login_app_info" style="display: none"></div>
            <div
              id="seatalk_login_button_wrapper"
              style="display: none"
              class="w-full flex justify-center"
            >
              <div id="seatalk_login_button"></div>
            </div>
          </div>
        </div>

        <!-- Email Login -->
        <div id="email-content" class="hidden">
          <form id="email-login-form" class="space-y-4">
            <div>
              <label
                for="login-email"
                class="block text-xs font-medium text-slate-300 mb-1"
                >Email</label
              >
              <input
                type="email"
                id="login-email"
                required
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition"
                placeholder="you@example.com"
              />
            </div>
            <div>
              <label
                for="login-password"
                class="block text-xs font-medium text-slate-300 mb-1"
                >Mật khẩu</label
              >
              <input
                type="password"
                id="login-password"
                required
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition"
                placeholder="••••••••"
              />
            </div>
            <button
              type="submit"
              class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded-xl transition"
            >
              Đăng nhập
            </button>
            <p
              id="email-login-error"
              class="hidden text-red-400 text-sm text-center"
            ></p>
          </form>
        </div>

        <!-- Lỗi chung -->
        <div
          id="error-message"
          class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-300 text-sm text-center"
        ></div>
      </div>

      <p class="text-center text-slate-500 text-xs mt-6">
        &copy; 2025 WMS. Đăng nhập bằng SeaTalk hoặc email.
      </p>
    </div>

    <!-- SeaTalk SDK -->
    <script src="https://static.cdn.haiserve.com/seatalk/client/shared/sop/auth.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const errorEl = $("error-message");
        const loadingEl = $("loading-indicator");
        const wrapperEl = $("seatalk_login_button_wrapper");
        const appInfoEl = $("seatalk_login_app_info");
        const buttonEl = $("seatalk_login_button");
        const emailForm = $("email-login-form");
        const emailError = $("email-login-error");

        // Tab switching
        let activeTab = "seatalk";
        function setTab(tab) {
          activeTab = tab;
          $("tab-seatalk").classList.toggle(
            "text-amber-400",
            tab === "seatalk",
          );
          $("tab-seatalk").classList.toggle(
            "border-amber-400",
            tab === "seatalk",
          );
          $("tab-email").classList.toggle("text-amber-400", tab === "email");
          $("tab-email").classList.toggle("border-amber-400", tab === "email");
          $("seatalk-content").classList.toggle("hidden", tab !== "seatalk");
          $("email-content").classList.toggle("hidden", tab !== "email");
        }
        $("tab-seatalk").addEventListener("click", () => setTab("seatalk"));
        $("tab-email").addEventListener("click", () => setTab("email"));

        // Kiểm tra token cũ
        async function checkExistingToken() {
          const token = localStorage.getItem("qc_session_token");
          if (!token) return false;
          try {
            const resp = await fetch("/api/qc/me", {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (resp.ok) {
              window.location.href = "/index.html";
              return true;
            }
          } catch {}
          localStorage.removeItem("qc_session_token");
          return false;
        }

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.classList.remove("hidden");
        }

        function handleUrlError() {
          const params = new URLSearchParams(window.location.search);
          const error = params.get("error");
          if (!error) return false;
          const messages = {
            missing_code: "Thiếu mã xác thực từ SeaTalk.",
            token_exchange_failed: "Xác thực không thành công.",
            sso_failed: "Xác minh SSO thất bại.",
            unauthorized: "Tài khoản không được phép.",
            internal_error: "Lỗi hệ thống.",
          };
          showError(messages[error] || "Đã xảy ra lỗi.");
          return true;
        }

        // Khởi tạo nút SeaTalk
        async function initSeaTalk() {
          try {
            const res = await fetch("/api/config/public");
            const config = await res.json();
            const { seatalkAppId, seatalkRedirectUri } = config;
            if (!seatalkAppId || !seatalkRedirectUri)
              throw new Error("Thiếu cấu hình");

            const state = crypto.randomUUID();
            sessionStorage.setItem("seatalk_oauth_state", state);
            appInfoEl.setAttribute("data-appid", seatalkAppId);
            appInfoEl.setAttribute("data-redirect_uri", seatalkRedirectUri);
            appInfoEl.setAttribute("data-response_type", "code");
            appInfoEl.setAttribute("data-state", state);
            buttonEl.setAttribute("data-size", "medium");
            buttonEl.setAttribute("data-theme", "light");
            buttonEl.setAttribute("data-copywriting", "Đăng nhập với SeaTalk");
            loadingEl.style.display = "none";
            wrapperEl.style.display = "flex";
            if (typeof SOPAuth !== "undefined" && SOPAuth.render)
              SOPAuth.render();
          } catch (e) {
            showError("Không thể tải cấu hình SeaTalk");
          }
        }

        // Đăng nhập bằng email
        emailForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = $("login-email").value.trim();
          const password = $("login-password").value;
          emailError.classList.add("hidden");
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (res.ok && data.success) {
              localStorage.setItem("qc_session_token", data.token);
              window.location.href = "/index.html";
            } else {
              emailError.textContent = data.error || "Đăng nhập thất bại";
              emailError.classList.remove("hidden");
            }
          } catch (err) {
            emailError.textContent = "Lỗi kết nối";
            emailError.classList.remove("hidden");
          }
        });

        // Main
        (async function main() {
          if (await checkExistingToken()) return;
          if (handleUrlError()) return;
          await initSeaTalk();
        })();
      })();
    </script>
  </body>
</html>
