<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan Events – Trích xuất dữ liệu quét hàng</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-success: #10b981;
        --color-success-hover: #059669;
        --color-bg: #f1f5f9;
        --color-surface: #ffffff;
        --color-border: #e2e8f0;
        --color-text: #1e293b;
        --color-text-secondary: #64748b;
        --color-text-muted: #94a3b8;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        --radius-lg: 1rem;
        --radius-md: 0.5rem;
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-text);
        padding: 2rem;
        min-height: 100vh;
      }
      .app-container {
        max-width: 1440px;
        margin: 0 auto;
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        overflow: hidden;
      }
      .app-header {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: white;
        padding: 1.5rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .app-header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .app-header p {
        color: #94a3b8;
      }
      .filters-card {
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
        padding: 1.5rem 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-end;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .filter-group label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-secondary);
      }
      .filter-group input,
      .filter-group select {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        font-size: 0.875rem;
        background: white;
        min-width: 150px;
        transition: border-color 0.2s;
      }
      .filter-group input:focus,
      .filter-group select:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }
      .multi-select {
        position: relative;
        min-width: 200px;
      }
      .multi-select-trigger {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: white;
        cursor: pointer;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        user-select: none;
        transition: border-color 0.2s;
      }
      .multi-select-trigger:hover {
        border-color: #94a3b8;
      }
      .multi-select-values {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        max-width: 160px;
        overflow: hidden;
      }
      .multi-select-badge {
        background: var(--color-primary);
        color: white;
        font-size: 0.7rem;
        padding: 0.1rem 0.5rem;
        border-radius: 12px;
        white-space: nowrap;
      }
      .multi-select-placeholder {
        color: var(--color-text-muted);
      }
      .multi-select-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: white;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        z-index: 100;
        max-height: 240px;
        overflow-y: auto;
        display: none;
      }
      .multi-select-dropdown.open {
        display: block;
      }
      .multi-select-item {
        padding: 0.5rem 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        font-size: 0.875rem;
        transition: background 0.1s;
      }
      .multi-select-item:hover {
        background: #f8fafc;
      }
      .multi-select-item input[type="checkbox"] {
        accent-color: var(--color-primary);
      }
      .btn {
        padding: 0.5rem 1.25rem;
        border: none;
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--color-primary);
        color: white;
      }
      .btn-primary:hover {
        background: var(--color-primary-hover);
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #334155;
      }
      .btn-secondary:hover {
        background: #cbd5e1;
      }
      .btn-success {
        background: var(--color-success);
        color: white;
      }
      .btn-success:hover {
        background: var(--color-success-hover);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .column-selector-bar {
        padding: 0.75rem 2rem;
        background: #f8fafc;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .column-selector-bar .label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--color-text-secondary);
      }
      .column-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.25rem 0.75rem;
        background: white;
        border: 1px solid var(--color-border);
        border-radius: 20px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }
      .column-chip.active {
        background: var(--color-primary);
        color: white;
        border-color: var(--color-primary);
      }
      .column-chip:hover:not(.active) {
        border-color: #94a3b8;
      }
      .table-wrapper {
        padding: 1.5rem 2rem;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }
      th {
        background: #f8fafc;
        padding: 0.75rem 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--color-text-secondary);
        border-bottom: 2px solid var(--color-border);
        white-space: nowrap;
      }
      td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #f1f5f9;
        white-space: nowrap;
        color: #334155;
      }
      tr:hover td {
        background: #f8fafc;
      }
      .status-bar {
        padding: 1rem 2rem;
        background: #f8fafc;
        border-top: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        font-weight: 500;
        color: var(--color-text-secondary);
      }
      .relative {
        position: relative;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e293b;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 30px;
        font-size: 0.875rem;
        box-shadow: var(--shadow-md);
        z-index: 9999;
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container" id="app">
      <div class="app-header">
        <h1>📋 Scan Events</h1>
        <p>Trích xuất dữ liệu quét hàng – lọc thông minh, copy linh hoạt</p>
      </div>

      <div class="filters-card">
        <div class="filter-group">
          <label>Ngày</label>
          <input type="date" id="filter-date" />
        </div>
        <div class="filter-group">
          <label>Loại hàng</label>
          <div class="multi-select" id="type-group-multi">
            <div class="multi-select-trigger" id="type-group-trigger">
              <div class="multi-select-values" id="type-group-values"></div>
              <span style="font-size: 0.7rem">▼</span>
            </div>
            <div class="multi-select-dropdown" id="type-group-dropdown"></div>
          </div>
        </div>
        <div class="filter-group">
          <label>ID Trạm</label>
          <input type="text" id="station-id" placeholder="Ví dụ: 3A" />
        </div>
        <div class="filter-group">
          <label>Event Type</label>
          <select id="event-type">
            <option value="">Tất cả</option>
          </select>
        </div>
        <button class="btn btn-primary" id="search-btn">🔍 Tìm kiếm</button>
        <button class="btn btn-success" id="copy-btn" disabled>
          📋 Sao chép
        </button>
        <button class="btn btn-secondary" id="reset-btn">↺ Đặt lại</button>
      </div>

      <div class="column-selector-bar" id="column-selector">
        <span class="label">Cột sao chép:</span>
      </div>

      <div class="relative" id="table-area">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Event Type</th>
                <th>Email</th>
                <th>Station ID</th>
                <th>Type Group</th>
                <th>Return TN</th>
                <th>TO Number</th>
                <th>Item Count</th>
                <th>Created At</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr>
                <td
                  colspan="9"
                  style="
                    text-align: center;
                    padding: 3rem;
                    color: var(--color-text-muted);
                  "
                >
                  Chưa có dữ liệu. Nhấn <strong>Tìm kiếm</strong> để bắt đầu.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="loading-overlay" class="loading-overlay" style="display: none">
          ⏳ Đang tải dữ liệu...
        </div>
      </div>

      <div class="status-bar">
        <span id="result-count" class="copy-info"></span>
        <span style="color: var(--color-text-muted); font-size: 0.875rem"
          >Mẹo: Ctrl+V trực tiếp vào Google Sheets</span
        >
      </div>
    </div>

    <script>
      (() => {
        const SUPABASE_URL = "https://gjnfyjmrrpxmnufikjgo.supabase.co";
        const SUPABASE_ANON_KEY =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqbmZ5am1ycnB4bW51ZmlramdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDg1MTIsImV4cCI6MjEwMTEyNDUxMn0.TKEFJNI4_r_c1frKroSLAUhbE8YW4ofdLwQPrwSbsT4";
        const supabaseClient = supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );

        const dateEl = document.getElementById("filter-date");
        const typeGroupTrigger = document.getElementById("type-group-trigger");
        const typeGroupValues = document.getElementById("type-group-values");
        const typeGroupDropdown = document.getElementById(
          "type-group-dropdown",
        );
        const stationIdEl = document.getElementById("station-id");
        const eventTypeEl = document.getElementById("event-type");
        const searchBtn = document.getElementById("search-btn");
        const copyBtn = document.getElementById("copy-btn");
        const resetBtn = document.getElementById("reset-btn");
        const tableBody = document.getElementById("table-body");
        const resultCount = document.getElementById("result-count");
        const loadingOverlay = document.getElementById("loading-overlay");
        const columnSelector = document.getElementById("column-selector");

        let currentRows = [];
        let allTypeGroups = [];
        let selectedTypeGroups = new Set();
        let selectedColumns = new Set();

        const columnDefs = [
          { key: "id", label: "ID" },
          { key: "event_type", label: "Event Type" },
          { key: "email", label: "Email" },
          { key: "station_id", label: "Station ID" },
          { key: "type_group", label: "Type Group" },
          { key: "return_tn", label: "Return TN" },
          { key: "to_number", label: "TO Number" },
          { key: "item_count", label: "Item Count" },
          { key: "created_at", label: "Created At" },
        ];

        const formatDate = (d) =>
          new Date(d).toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" });
        const todayStr = () =>
          new Date(new Date().getTime() + 7 * 3600 * 1000)
            .toISOString()
            .slice(0, 10);

        function updateTypeGroupUI() {
          if (
            selectedTypeGroups.size === 0 ||
            selectedTypeGroups.size === allTypeGroups.length
          ) {
            typeGroupValues.innerHTML =
              '<span class="multi-select-placeholder">Tất cả</span>';
          } else {
            const arr = [...selectedTypeGroups];
            let html = arr
              .slice(0, 2)
              .map((v) => `<span class="multi-select-badge">${v}</span>`)
              .join("");
            if (arr.length > 2)
              html += `<span class="multi-select-badge">+${arr.length - 2}</span>`;
            typeGroupValues.innerHTML = html;
          }
        }

        function renderTypeGroupDropdown() {
          typeGroupDropdown.innerHTML = "";
          allTypeGroups.forEach((tg) => {
            const row = document.createElement("div");
            row.className = "multi-select-item";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.value = tg;
            cb.checked = selectedTypeGroups.has(tg);
            row.appendChild(cb);
            row.appendChild(document.createTextNode(tg));
            row.addEventListener("click", (e) => {
              if (e.target !== cb) {
                cb.checked = !cb.checked;
              }
              cb.dispatchEvent(new Event("change"));
            });
            cb.addEventListener("change", () => {
              cb.checked
                ? selectedTypeGroups.add(tg)
                : selectedTypeGroups.delete(tg);
              updateTypeGroupUI();
            });
            typeGroupDropdown.appendChild(row);
          });
        }

        function toggleDropdown(e) {
          e.stopPropagation();
          typeGroupDropdown.classList.toggle("open");
        }
        function closeDropdown() {
          typeGroupDropdown.classList.remove("open");
        }

        function renderColumnSelector() {
          columnSelector.innerHTML = '<span class="label">Cột sao chép:</span>';
          columnDefs.forEach((col) => {
            const chip = document.createElement("span");
            chip.className =
              "column-chip" + (selectedColumns.has(col.key) ? " active" : "");
            chip.textContent = col.label;
            chip.addEventListener("click", () => {
              if (selectedColumns.has(col.key)) {
                selectedColumns.delete(col.key);
                chip.classList.remove("active");
              } else {
                selectedColumns.add(col.key);
                chip.classList.add("active");
              }
            });
            columnSelector.appendChild(chip);
          });
        }

        async function loadFilterOptions() {
          const [typeRes, eventRes] = await Promise.all([
            supabaseClient
              .from("scan_events")
              .select("type_group")
              .order("type_group"),
            supabaseClient
              .from("scan_events")
              .select("event_type")
              .order("event_type"),
          ]);
          if (typeRes.data) {
            allTypeGroups = [
              ...new Set(typeRes.data.map((d) => d.type_group).filter(Boolean)),
            ];
            selectedTypeGroups = new Set(allTypeGroups);
            renderTypeGroupDropdown();
            updateTypeGroupUI();
          }
          if (eventRes.data) {
            const events = [
              ...new Set(
                eventRes.data.map((d) => d.event_type).filter(Boolean),
              ),
            ];
            eventTypeEl.innerHTML =
              '<option value="">Tất cả</option>' +
              events.map((e) => `<option value="${e}">${e}</option>`).join("");
          }
        }

        function buildQuery() {
          const date = dateEl.value;
          const station = stationIdEl.value.trim();
          const evType = eventTypeEl.value;
          const typeArr = [...selectedTypeGroups];

          let q = supabaseClient
            .from("scan_events")
            .select("*", { count: "exact" })
            .order("created_at", { ascending: false });
          if (date) {
            q = q
              .gte("created_at", `${date}T00:00:00+07:00`)
              .lte("created_at", `${date}T23:59:59+07:00`);
          }
          if (typeArr.length > 0 && typeArr.length < allTypeGroups.length) {
            q = q.in("type_group", typeArr);
          }
          if (station) q = q.eq("station_id", station);
          if (evType) q = q.eq("event_type", evType);
          return q.limit(1000);
        }

        async function fetchData() {
          const { data, error } = await buildQuery();
          if (error) throw error;
          return data || [];
        }

        function renderTable(rows) {
          currentRows = rows;
          if (!rows.length) {
            tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:3rem; color:var(--color-text-muted);">Không tìm thấy dữ liệu phù hợp.</td></tr>`;
            copyBtn.disabled = true;
            resultCount.textContent = "";
            return;
          }
          tableBody.innerHTML = rows
            .map(
              (r) => `
          <tr>
            <td>${r.id}</td><td>${r.event_type || ""}</td><td>${r.email || ""}</td>
            <td>${r.station_id || ""}</td><td>${r.type_group || ""}</td>
            <td>${r.return_tn || ""}</td><td>${r.to_number || ""}</td>
            <td>${r.item_count ?? ""}</td><td>${formatDate(r.created_at)}</td>
          </tr>`,
            )
            .join("");
          copyBtn.disabled = false;
          resultCount.textContent = `Tìm thấy ${rows.length} bản ghi.`;
        }

        async function handleSearch() {
          loadingOverlay.style.display = "flex";
          try {
            renderTable(await fetchData());
          } catch (err) {
            tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:2rem; color:#ef4444;">Lỗi: ${err.message}</td></tr>`;
            copyBtn.disabled = true;
            resultCount.textContent = "";
          } finally {
            loadingOverlay.style.display = "none";
          }
        }

        function copySelectedColumns() {
          if (!currentRows.length) return;
          const colsToCopy = columnDefs.filter((c) =>
            selectedColumns.has(c.key),
          );
          if (!colsToCopy.length) {
            alert("Vui lòng chọn ít nhất một cột để sao chép.");
            return;
          }
          const header = colsToCopy.map((c) => c.label).join("\t");
          const rows = currentRows.map((row) =>
            colsToCopy
              .map((col) => {
                let val = row[col.key];
                if (col.key === "created_at") val = formatDate(val);
                return val ?? "";
              })
              .join("\t"),
          );
          const text = header + "\n" + rows.join("\n");
          navigator.clipboard
            .writeText(text)
            .then(() => {
              showToast("✅ Đã sao chép vào clipboard!");
              copyBtn.disabled = true;
              setTimeout(() => {
                copyBtn.disabled = false;
              }, 2000);
            })
            .catch(() => alert("Sao chép thất bại."));
        }

        function showToast(msg) {
          const toast = document.createElement("div");
          toast.className = "toast";
          toast.textContent = msg;
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 2500);
        }

        function resetFilters() {
          dateEl.value = todayStr();
          stationIdEl.value = "";
          eventTypeEl.value = "";
          selectedTypeGroups = new Set(allTypeGroups);
          [
            ...typeGroupDropdown.querySelectorAll("input[type=checkbox]"),
          ].forEach((cb) => {
            cb.checked = true;
          });
          updateTypeGroupUI();
          currentRows = [];
          renderTable([]);
        }

        function initEvents() {
          typeGroupTrigger.addEventListener("click", toggleDropdown);
          document.addEventListener("click", (e) => {
            if (!e.target.closest("#type-group-multi")) closeDropdown();
          });
          searchBtn.addEventListener("click", handleSearch);
          resetBtn.addEventListener("click", resetFilters);
          copyBtn.addEventListener("click", copySelectedColumns);
          stationIdEl.addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSearch();
          });
        }

        async function init() {
          dateEl.value = todayStr();
          selectedColumns = new Set(columnDefs.map((c) => c.key));
          renderColumnSelector();
          await loadFilterOptions();
          initEvents();
          handleSearch();
        }
        init();
      })();
    </script>
  </body>
</html>
