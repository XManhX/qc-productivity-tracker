<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In Nhãn Trạm – Nhóm Station ID (Chữ to, rõ ràng)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #f1f5f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .control-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        background: white;
        padding: 12px 24px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        flex-wrap: wrap;
        justify-content: center;
        position: sticky;
        top: 10px;
        z-index: 10;
      }
      .control-bar label {
        font-weight: 600;
        color: #334155;
      }
      select,
      button {
        padding: 10px 18px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        background: white;
        cursor: pointer;
        transition: 0.2s;
      }
      select:hover,
      button:hover {
        border-color: #94a3b8;
      }
      button.print-btn {
        background: #1e293b;
        color: white;
        border: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button.print-btn:hover {
        background: #0f172a;
      }

      .preview-wrapper {
        width: 100%;
        max-width: 1000px;
        background: #e2e8f0;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: auto;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
      }
      .page-scaler {
        transform-origin: top center;
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .print-page {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        margin-bottom: 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); /* chỉ ở preview */
        page-break-after: always;
        break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-page:last-child {
        page-break-after: auto;
      }

      .station-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-align: center;
        gap: 2rem;
      }

      /* Mã trạm cực lớn */
      .station-id {
        font-size: 35vw;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Danh sách tên gọi – to, rõ */
      .station-names {
        font-size: 9vw;
        font-weight: 700;
        line-height: 1.3;
        opacity: 0.95;
        max-width: 90%;
        word-break: break-word;
      }

      @media print {
        body {
          background: white;
          padding: 0;
          margin: 0;
        }
        .control-bar {
          display: none !important;
        }
        .preview-wrapper {
          display: block !important;
          background: none;
          padding: 0;
          box-shadow: none;
          overflow: visible;
          max-width: none;
          border-radius: 0;
        }
        .page-scaler {
          transform: none !important;
        }
        .print-page {
          box-shadow: none;
          margin: 0;
          page-break-after: always;
          width: 100vw;
          height: 100vh;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
    <style id="print-orientation-style"></style>
  </head>
  <body>
    <div class="control-bar">
      <label for="paperSize">📄 Khổ giấy:</label>
      <select id="paperSize">
        <option value="A3">A3</option>
        <option value="A4" selected>A4</option>
        <option value="A5">A5</option>
        <option value="A6">A6</option>
        <option value="Letter">Letter</option>
        <option value="Legal">Legal</option>
        <option value="Tabloid">Tabloid</option>
      </select>

      <label for="orientation">🔄 Hướng in:</label>
      <select id="orientation">
        <option value="portrait" selected>Dọc (Portrait)</option>
        <option value="landscape">Ngang (Landscape)</option>
      </select>

      <button class="print-btn" onclick="window.print()">
        🖨️ In tất cả trạm
      </button>
    </div>

    <div class="preview-wrapper" id="previewWrapper">
      <div class="page-scaler" id="pageScaler"></div>
    </div>

    <script>
      (() => {
        // Dữ liệu gốc
        const ITEMS = [
          { id: 1, station_id: "1", display_name: "NA" },
          { id: 2, station_id: "1", display_name: "NA-COM" },
          { id: 3, station_id: "2", display_name: "CB" },
          { id: 4, station_id: "2", display_name: "WH-QC" },
          { id: 5, station_id: "3", display_name: "CB-GTC" },
          { id: 6, station_id: "4", display_name: "FBS_P-B" },
          { id: 7, station_id: "5", display_name: "FBS_S-A" },
          { id: 8, station_id: "6", display_name: "FBS_S-B" },
          { id: 9, station_id: "7", display_name: "FBS_V" },
          { id: 10, station_id: "8", display_name: "Wrong-A" },
          { id: 11, station_id: "9", display_name: "Wrong-B" },
          { id: 12, station_id: "A", display_name: "L'Oreal" },
          { id: 13, station_id: "B", display_name: "SBS-B" },
          { id: 14, station_id: "C", display_name: "SBS-GTC" },
          { id: 15, station_id: "D", display_name: "SBS-Resell" },
        ];

        // Nhóm theo station_id
        const GROUPS = {};
        ITEMS.forEach((item) => {
          const sid = String(item.station_id).toUpperCase();
          if (!GROUPS[sid]) GROUPS[sid] = [];
          GROUPS[sid].push(item);
        });

        // Bảng màu
        const STATION_COLORS = {
          1: "#E74C3C",
          2: "#3498DB",
          3: "#2ECC71",
          4: "#F39C12",
          5: "#9B59B6",
          6: "#1ABC9C",
          7: "#E67E22",
          8: "#2C3E50",
          9: "#E91E63",
          A: "#00BCD4",
          B: "#FF5722",
          C: "#795548",
          D: "#607D8B",
        };

        const getLuminance = (hex) => {
          const [r, g, b] = hex.match(/\w\w/g).map((c) => {
            const v = parseInt(c, 16) / 255;
            return v <= 0.03928
              ? v / 12.92
              : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        };
        const contrastRatio = (l1, l2) =>
          (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        const getTextColor = (bgHex) =>
          contrastRatio(getLuminance(bgHex), 0) >= 4.5 ? "#000000" : "#FFFFFF";

        const BASE_PAPERS = {
          A3: { w: 297, h: 420 },
          A4: { w: 210, h: 297 },
          A5: { w: 148, h: 210 },
          A6: { w: 105, h: 148 },
          Letter: { w: 215.9, h: 279.4 },
          Legal: { w: 215.9, h: 355.6 },
          Tabloid: { w: 279.4, h: 431.8 },
        };

        function getPaperSize(key, orientation) {
          const base = BASE_PAPERS[key];
          if (orientation === "landscape") return { w: base.h, h: base.w };
          return { w: base.w, h: base.h };
        }

        const scaler = document.getElementById("pageScaler");
        const paperSelect = document.getElementById("paperSize");
        const orientationSelect = document.getElementById("orientation");
        const wrapper = document.getElementById("previewWrapper");
        const printOrientationStyle = document.getElementById(
          "print-orientation-style",
        );

        let currentPaperKey = paperSelect.value;
        let currentOrientation = orientationSelect.value;

        function renderPages() {
          const paper = getPaperSize(currentPaperKey, currentOrientation);
          // Sắp xếp station_id: số trước (1-9), chữ sau (A-D)
          const stationIds = Object.keys(GROUPS).sort((a, b) => {
            const aIsNum = !isNaN(a),
              bIsNum = !isNaN(b);
            if (aIsNum && bIsNum) return Number(a) - Number(b);
            if (aIsNum) return -1;
            if (bIsNum) return 1;
            return a.localeCompare(b);
          });

          const pages = stationIds
            .map((sid) => {
              const items = GROUPS[sid];
              const bg = STATION_COLORS[sid] || "#607D8B";
              const color = getTextColor(bg);
              // Hiển thị tên gọi, mỗi tên một dòng, không kèm ID gốc
              const namesHtml = items
                .map((it) => `<div>${it.display_name}</div>`)
                .join("");
              return `
            <div class="print-page" style="
              width:${paper.w}mm; height:${paper.h}mm;
              background:${bg}; color:${color};
            ">
              <div class="station-content">
                <div class="station-id">${sid}</div>
                <div class="station-names">${namesHtml}</div>
              </div>
            </div>
          `;
            })
            .join("");

          scaler.innerHTML = pages;
          updatePrintOrientationStyle();
          requestAnimationFrame(() => updateScale());
        }

        function updateScale() {
          const paper = getPaperSize(currentPaperKey, currentOrientation);
          const mmToPx = 3.779527559;
          const pageWidthPx = paper.w * mmToPx;
          const wrapperWidth = wrapper.clientWidth - 40;
          const scale = Math.min(1, wrapperWidth / pageWidthPx);
          scaler.style.transform = `scale(${scale})`;
        }

        function updatePrintOrientationStyle() {
          printOrientationStyle.textContent =
            currentOrientation === "landscape"
              ? "@page { size: landscape; }"
              : "@page { size: portrait; }";
        }

        paperSelect.addEventListener("change", (e) => {
          currentPaperKey = e.target.value;
          renderPages();
        });
        orientationSelect.addEventListener("change", (e) => {
          currentOrientation = e.target.value;
          renderPages();
        });
        window.addEventListener("resize", () => updateScale());

        renderPages();
      })();
    </script>
  </body>
</html>
