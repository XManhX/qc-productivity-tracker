<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ WMS QC MONITOR - Quản Lý Nhân Sự</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="css/users.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Navigation giữ nguyên -->
    <nav
      class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-3">
            <div
              class="bg-amber-500 text-slate-950 p-2 rounded-lg flex items-center justify-center"
            >
              <i data-lucide="zap" class="w-5 h-5"></i>
            </div>
            <span class="text-white font-bold text-lg tracking-wider"
              >WMS QC MONITOR</span
            >
          </div>
          <div class="flex space-x-1">
            <a
              href="/"
              class="flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
            >
              <i data-lucide="bar-chart-3" class="w-4 h-4"></i
              ><span>Dashboard</span>
            </a>
            <a
              href="/users.html"
              class="flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-amber-400 border border-slate-700"
            >
              <i data-lucide="users" class="w-4 h-4"></i><span>Nhân Sự</span>
            </a>
            <a
              href="/targets.html"
              class="flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
            >
              <i data-lucide="target" class="w-4 h-4"></i
              ><span>Roles &amp; Targets</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-12 space-y-6">
          <div
            class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6"
          >
            <div id="single-user-container"></div>
            <div id="import-section-container"></div>
          </div>
        </div>
        <div class="lg:col-span-12">
          <div
            id="user-list-container"
            class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden"
          ></div>
        </div>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="js/main-users.js"></script>
  </body>
</html>
